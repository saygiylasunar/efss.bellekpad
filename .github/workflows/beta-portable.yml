name: beta-portable-windows
on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/package-beta.mjs
      - scripts/verify-beta.mjs
      - test/beta-package.test.js
      - .github/workflows/beta-portable.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beta-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Electron host
        run: npm install --no-audit --no-fund
      - name: Require core, privacy, and source checks
        run: |
          npm run sanity
          npm run check
          npm test
      - name: Run native Windows Electron GUI acceptance
        run: npm run desktop:smoke
      - name: Assemble offline portable beta
        run: npm run beta:package
      - name: Independently verify bundled application and hashes
        run: npm run beta:verify
      - name: Package portable folder and SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $folder = "BellekPad-$version-win32-x64"
          $zip = "dist/$folder.zip"
          Compress-Archive -Path "dist/$folder" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  $folder.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BellekPad-Windows-limited-beta
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
