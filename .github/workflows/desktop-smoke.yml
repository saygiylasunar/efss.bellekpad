name: desktop-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  electron-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron host (no editor frameworks)
        run: npm install --no-audit --no-fund
      - name: Ensure virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - name: Real Electron renderer + IPC + local vault smoke
        env:
          ELECTRON_DISABLE_SECURITY_WARNINGS: 'false'
        run: xvfb-run -a npm run desktop:smoke
